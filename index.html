<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7">
  <!-- Apply the saved theme and text size before the first paint so the page never flashes.
       Keep in sync with js/prefs.js, which takes over once the app loads. -->
  <script>
    (function () {
      var root = document.documentElement;
      var dark = false;
      try {
        var saved = localStorage.getItem('waste.theme');
        dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        var size = localStorage.getItem('waste.textSize');
        if (size === 'large' || size === 'xlarge') root.setAttribute('data-text-size', size);
      } catch (e) {}
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#000000' : '#f5f5f7');
    })();
  </script>
  <meta name="robots" content="noindex">
  <meta name="description" content="ตารางวันเก็บขยะ Königsbrunn สำหรับ Wat Phra Dhammakaya Bavaria">
  <!-- installed-app behaviour -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="เก็บขยะ">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>ตารางเก็บขยะ · Wat Phra Dhammakaya Bavaria</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/scene.css">
</head>
<body>
  <div class="navbar" id="navbar">
    <div class="navbar-inner">
      <span class="navbar-title" id="navbar-title" aria-hidden="true">ตารางเก็บขยะ</span>
      <button type="button" class="icon-btn navbar-btn" id="theme-toggle"></button>
    </div>
  </div>
  <div class="ptr" id="ptr" aria-hidden="true"><span class="ptr-spinner"></span></div>

  <main id="app">
    <noscript><p class="banner">หน้านี้ต้องเปิด JavaScript เพื่อแสดงตารางเก็บขยะ</p></noscript>

    <!-- วันนี้ -->
    <section class="screen" id="screen-today" aria-label="วันนี้">
      <div class="sky" aria-hidden="true"></div>
      <header class="large-title wrap">
        <p class="greeting" id="greeting"></p>
        <h1 id="title">ตารางเก็บขยะ</h1>
        <p class="org" id="org">Wat Phra Dhammakaya Bavaria</p>
      </header>
      <div class="wrap">
        <div id="debug"></div>
        <div id="announcements"></div>
        <div class="stage">
          <section id="hero" aria-live="polite" aria-label="การเก็บขยะครั้งถัดไป"></section>
          <div class="critters" id="critters-today"></div>
        </div>
        <section aria-labelledby="h-week" id="week-section">
          <h2 class="section-title" id="h-week">7 วันข้างหน้า</h2>
          <div class="card" id="week"></div>
        </section>
        <section aria-labelledby="h-upcoming">
          <h2 class="section-title" id="h-upcoming">หลังจากนั้น</h2>
          <div class="card" id="upcoming"></div>
        </section>
        <div id="install-banner"></div>
      </div>
    </section>

    <!-- ปฏิทิน -->
    <section class="screen" id="screen-calendar" aria-label="ปฏิทิน" hidden>
      <div class="sky" aria-hidden="true"></div>
      <header class="large-title wrap">
        <h1>ปฏิทิน</h1>
      </header>
      <div class="wrap">
        <div class="stage">
        <div class="card cal-card">
          <div class="cal-head">
            <h2 class="cal-title" id="cal-title" aria-live="polite"></h2>
            <div class="cal-actions">
              <button type="button" class="text-btn" id="goto-today" hidden>วันนี้</button>
              <button type="button" class="icon-btn" id="prev" aria-label="เดือนก่อนหน้า"></button>
              <button type="button" class="icon-btn" id="next" aria-label="เดือนถัดไป"></button>
            </div>
          </div>
          <div id="cal-notice"></div>
          <div class="weekdays" aria-hidden="true">
            <span>จ.</span><span>อ.</span><span>พ.</span><span>พฤ.</span><span>ศ.</span><span>ส.</span><span>อา.</span>
          </div>
          <div class="grid" id="grid"></div>
          <div id="chips" class="chips" role="group" aria-label="แตะเพื่อซ่อนหรือแสดงประเภทขยะ"></div>
        </div>
          <div class="critters" id="critters-calendar"></div>
        </div>
        <section id="month-summary" aria-labelledby="h-month" hidden>
          <h2 class="section-title" id="h-month"></h2>
          <div class="card summary" id="month-summary-card"></div>
        </section>
      </div>
    </section>

    <!-- เพิ่มเติม -->
    <section class="screen" id="screen-more" aria-label="เพิ่มเติม" hidden>
      <div class="sky" aria-hidden="true"></div>
      <header class="large-title wrap">
        <h1>เพิ่มเติม</h1>
      </header>
      <div class="wrap">
        <div class="stage">
          <div class="card profile" id="profile"></div>
          <div class="critters" id="critters-more"></div>
        </div>

        <h2 class="section-title">การแสดงผล</h2>
        <div class="card" id="appearance"></div>

        <h2 class="section-title">แชร์และปฏิทิน</h2>
        <div class="card" id="share"></div>
        <div id="install"></div>

        <h2 class="section-title">เกี่ยวกับ</h2>
        <div class="card" id="about"></div>
        <p class="footnote about-note" id="source-note"></p>
      </div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="เมนูหลัก">
    <span class="tab-lens" aria-hidden="true"></span>
    <button type="button" class="tab" data-tab="today" data-icon="sun"><span class="tab-icon"></span><span>วันนี้</span></button>
    <button type="button" class="tab" data-tab="calendar" data-icon="calendar"><span class="tab-icon"></span><span>ปฏิทิน</span></button>
    <button type="button" class="tab" data-tab="more" data-icon="more"><span class="tab-icon"></span><span>เพิ่มเติม</span></button>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-grab" id="sheet-grab">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <div>
          <h2 class="sheet-title" id="sheet-title"></h2>
          <p class="sheet-meta" id="sheet-meta"></p>
        </div>
        <button type="button" class="text-btn" id="sheet-done">เสร็จสิ้น</button>
      </div>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <section id="print-sheet" aria-hidden="true"></section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
